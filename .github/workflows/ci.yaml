name: Gosub Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  # Beacon depends on the engine through relative path dependencies
  # (`../gosub-engine/crates/*`, see Cargo.toml), so CI checks the engine out as a
  # sibling directory. `beacon` is a long-lived branch on the canonical engine repo.
  # It follows gosub-io/gosub-engine main, and additionally carries any engine work
  # Beacon needs that has not landed on main yet -- so Beacon always compiles while
  # the engine's own main stays stable. Keep it in sync by merging main into it after
  # engine PRs land, and drop beacon-only commits once they merge upstream.
  ENGINE_REPO: gosub-io/gosub-engine
  ENGINE_REF: beacon

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust_version: [ stable ]
    steps:
      - uses: actions/checkout@v7
        with:
          path: gosub-beacon
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: gosub-engine
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust_version }}
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            libgtk-4-dev libglib2.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev \
            libsqlite3-dev libssl-dev pkg-config \
            clang libclang-dev libgl-dev libegl-dev libfontconfig-dev libfreetype-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gosub-beacon
      - name: Build
        working-directory: gosub-beacon
        run: cargo build --verbose --all

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust_version: [ stable ]
    steps:
      - uses: actions/checkout@v7
        with:
          path: gosub-beacon
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: gosub-engine
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust_version }}
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            libgtk-4-dev libglib2.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev \
            libsqlite3-dev libssl-dev pkg-config \
            clang libclang-dev libgl-dev libegl-dev libfontconfig-dev libfreetype-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gosub-beacon
      - name: Run tests
        working-directory: gosub-beacon
        run: cargo test --verbose --all --no-fail-fast --all-targets

  # The renderer tier end to end: a plain and an `--isolated` run of the GTK binary under
  # Xvfb against a fixture page, then the component processes, the log, the recorded
  # title and a screenshot comparison. See scripts/isolation-smoke.sh.
  isolation-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: gosub-beacon
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: gosub-engine
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            libgtk-4-dev libglib2.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev \
            libsqlite3-dev libssl-dev pkg-config \
            clang libclang-dev libgl-dev libegl-dev libfontconfig-dev libfreetype-dev \
            xvfb xdotool imagemagick dbus
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gosub-beacon
          key: isolation
      - name: Build (isolation feature)
        working-directory: gosub-beacon
        run: cargo build --verbose --bin gosub-beacon-gtk --no-default-features --features gtk,isolation
      - name: Smoke test
        working-directory: gosub-beacon
        run: SMOKE_OUT=/tmp/smoke xvfb-run -a -s "-screen 0 1400x900x24" scripts/isolation-smoke.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: isolation-smoke
          path: /tmp/smoke
          if-no-files-found: ignore

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          path: gosub-beacon
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: gosub-engine
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gosub-beacon
      - name: Build the egui frontend
        working-directory: gosub-beacon
        run: cargo build --verbose -p gosub-beacon --no-default-features --features egui
      - name: Test the toolkit-neutral core
        working-directory: gosub-beacon
        run: cargo test --verbose -p beacon-core --no-fail-fast

  # The C ABI on Darwin -- the thing a Swift chrome actually links against -- and the only
  # job that *runs* the browser on macOS rather than merely compiling it. The C consumer
  # loads a page, walks session history, scrolls and composites, then exits non-zero if any
  # of that failed. It is headless and needs no network: its pages are generated into /tmp
  # and loaded over file://.
  #
  # Its own job rather than a step in `macos` because the two build different renderers:
  # beacon-ffi uses Vello here, the egui frontend has its own graph, and a shared cache key
  # would thrash both.
  macos-ffi:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          path: gosub-beacon
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: gosub-engine
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gosub-beacon
          # Its own cache: this job's dependency graph includes Skia and the egui job's
          # does not, so sharing a key would thrash both.
          prefix-key: macos-ffi
      - name: Build the C ABI
        working-directory: gosub-beacon
        run: cargo build --verbose -p beacon-ffi
      - name: Build and run the C consumer
        working-directory: gosub-beacon/crates/beacon-ffi
        run: make run

  # The Swift/AppKit shell in swift/. package.sh is the one build path the published DMGs
  # go through, so CI runs that rather than a separate `swift build`: release beacon-ffi,
  # the Swift package against it, the .app assembled with the dylib inside, its rpaths
  # checked, and an ad-hoc signature verified. --app stops before the DMG (styling it
  # needs Finder), --native builds the runner's arm64 only. No signing identity or notary
  # credentials are set here, so nothing is signed with a real certificate.
  #
  # The Swift package has no test target, so there is nothing to run beyond the build.
  # Its own cache for the same reason as macos-ffi: this is a release build, the others
  # are debug, and sharing a key would thrash them.
  macos-swift:
    runs-on: macos-14
    env:
      # The image defaults to Xcode 15.4 (Swift 5.10); the app is developed with Swift 6.x,
      # so use the newest Xcode the image carries rather than a compiler nobody builds with.
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          path: gosub-beacon
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: gosub-engine
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gosub-beacon
          prefix-key: macos-swift
      - name: Build the Swift app
        working-directory: gosub-beacon
        run: ./swift/package.sh --app --native
      - name: Check the app bundle
        working-directory: gosub-beacon/swift/build
        run: |
          test -x "Gosub Beacon.app/Contents/MacOS/BeaconMac"
          test -f "Gosub Beacon.app/Contents/Frameworks/libbeacon.dylib"
          test -d "Gosub Beacon.app/Contents/Resources/BeaconMac_BeaconMac.bundle"
          codesign --verify --deep --strict "Gosub Beacon.app"

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: gosub-beacon
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: gosub-engine
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            libgtk-4-dev libglib2.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev \
            libsqlite3-dev libssl-dev pkg-config \
            clang libclang-dev libgl-dev libegl-dev libfontconfig-dev libfreetype-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gosub-beacon
      - name: Run Clippy
        working-directory: gosub-beacon
        run: cargo clippy --all --tests -- -D warnings

  fmt:
    runs-on: ubuntu-24.04
    steps:
      # The engine has to be here even to check formatting: `cargo fmt --all` enumerates
      # workspace members through `cargo metadata`, which resolves every path dependency.
      # A single-package repo could skip this; a virtual workspace cannot.
      - uses: actions/checkout@v7
        with:
          path: gosub-beacon
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: gosub-engine
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run fmt
        working-directory: gosub-beacon
        run: cargo fmt --check --all
