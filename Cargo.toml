[workspace]
resolver = "2"
members = ["crates/beacon", "crates/beacon-core", "crates/beacon-egui", "crates/beacon-ffi", "crates/beacon-gtk"]
default-members = ["crates/beacon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Gosub Community <info@gosub.io>"]
license = "MIT"

[workspace.dependencies]
gosub_engine = { path = "../gosub-engine/crates/gosub_engine", features = [
    "sqlite_cookie_store",
    "sqlite_places",
    "timing",
] }
gosub_render_pipeline = { path = "../gosub-engine/crates/gosub_render_pipeline" }
gosub_shared = { path = "../gosub-engine/crates/gosub_shared" }
gosub_renderer_skia = { path = "../gosub-engine/crates/gosub_renderer_skia" }
gosub_renderer_vello = { path = "../gosub-engine/crates/gosub_renderer_vello" }

skia-safe = { version = "0.99.0", features = ["gl"] }
# gtk4 must match the version the engine's `gtk4` feature pins.
gtk4 = { version = "0.11.1", features = ["v4_6", "v4_14"] }
gtk-macros = "0.3"

eframe = { version = "0.35.0", features = ["wgpu"] }
egui = "0.35.0"
vello = "0.8.0"
parking_lot = "0.12"
glib-build-tools = "0.21.0"

anyhow = "1.0.95"
async-channel = "2.3.1"
chrono = { version = "0.4.39", features = [] }
clap = { version = "4.6.0", features = ["derive"] }
colog = "1.3.0"
dirs = "6.0.0"
lazy_static = "1.5.0"
log = "0.4.22"
once_cell = "1.5"
reqwest = { version = "0.12.11", features = ["gzip", "brotli", "deflate", "http2", "rustls-tls"] }
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5.2"
uuid = { version = "1.11.0", features = ["v4", "v7"] }

[patch.crates-io]
vello = { git = "https://github.com/linebender/vello", rev = "1b24e77ba4e01d12f5db86a9b1b5f2cf828a6a33" }
vello_encoding = { git = "https://github.com/linebender/vello", rev = "1b24e77ba4e01d12f5db86a9b1b5f2cf828a6a33" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
