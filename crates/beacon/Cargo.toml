[package]
name = "gosub-beacon"
description = "Gosub Beacon — a web browser built on the Gosub engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The binary keeps its name: the Dockerfile entrypoint, the headless driver and
# anything else pointing at target/debug/gosub-beacon expect it.
[[bin]]
name = "gosub-beacon"
path = "src/main.rs"

[features]
# GTK is the frontend that has parity today, so it stays the default. egui is built with
#   cargo run -p gosub-beacon --no-default-features --features egui
default = ["gtk"]
gtk = ["dep:beacon-gtk"]
egui = ["dep:beacon-egui"]

[dependencies]
beacon-gtk = { path = "../beacon-gtk", optional = true }
beacon-egui = { path = "../beacon-egui", optional = true }
