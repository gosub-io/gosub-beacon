[package]
name = "beacon-core"
description = "Toolkit-neutral browser logic behind Gosub Beacon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Run with every component process unless `--single-process` is given. Selected by the
# GTK frontend's `isolation` feature, which also brings the rasterizer and font system the
# renderer tier needs; on its own it only changes the default of the switch.
isolated-by-default = []
# The engine's gemini:// protocol, with the client identities it presents. Off for preview 1.
gemini = ["gosub_engine/gemini"]

[dependencies]
gosub_engine.workspace = true
gosub_render_pipeline.workspace = true
gosub_shared.workspace = true
beacon-profile = { path = "../beacon-profile" }

anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
lazy_static.workspace = true
log.workspace = true
# One-shot fetch for `view-source:`, which cannot go through the engine -- see src/fetch.rs.
reqwest.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The clock-tick rate `/proc` start times are counted in, for the Processes tab.
rustix = { version = "1.1", features = ["param"] }
