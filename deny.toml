[advisories]
version = 2
unmaintained = "all"
yanked = "warn"
ignore = [
    # `bincode` 1.3.3 development has ceased; the advisory itself states 1.3.3 is
    # considered complete. Reaches us through the engine's gosub_ipc (same binary on
    # both ends of the wire).
    "RUSTSEC-2025-0141", # bincode unmaintained
    # `ttf-parser` is pulled in transitively by the engine's SVG and font stacks.
    "RUSTSEC-2026-0192", # ttf-parser unmaintained
    # zvariant, zvariant_derive and zbus_names were folded into zbus 6. Both zbus
    # versions here are transitive: keyring's Secret Service backend (zbus 4) and
    # eframe's AccessKit (zbus 5). Revisit when those move to zbus 6.
    "RUSTSEC-2026-0370", # zvariant unmaintained
    "RUSTSEC-2026-0371", # zvariant_derive unmaintained
    "RUSTSEC-2026-0372", # zbus_names unmaintained
]

[licenses]
version = 2
private.ignore = true
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",       # clipboard-win, error-code
    "CC0-1.0",       # hexf-parse
    "ISC",
    "Zlib",
    "MPL-2.0",       # dwrote, option-ext (weak, file-level copyleft)
    "NCSA",          # libfuzzer-sys
    "OFL-1.1",       # epaint_default_fonts (bundled fonts)
    "Ubuntu-font-1.0", # epaint_default_fonts (bundled fonts)
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = [
    # AI Fork of serde_yaml
    "serde_yml",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # vello is consumed from a pinned git revision until an upstream release lands.
    "https://github.com/linebender/vello",
]
